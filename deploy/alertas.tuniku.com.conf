# Modelo do site do Nginx (sistema, fora do Docker) para alertas.tuniku.com.
# Este arquivo é só referência versionada — a cópia que realmente vale é a
# que fica em /etc/nginx/sites-available/alertas.tuniku.com no VPS.
#
# Instalação (rodar no VPS como root):
#   cp deploy/alertas.tuniku.com.conf /etc/nginx/sites-available/alertas.tuniku.com
#   ln -s /etc/nginx/sites-available/alertas.tuniku.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d alertas.tuniku.com
#
# O certbot reescreve este arquivo sozinho para adicionar o bloco de HTTPS
# (listen 443, certificado, redirect de 80 para 443) — não precisa fazer
# isso manualmente, e é normal o arquivo mudar depois desse comando.

server {
    listen 80;
    listen [::]:80;
    server_name alertas.tuniku.com;

    client_max_body_size 10m;

    # API Laravel — container "alertas-api" publicado só em localhost.
    # Sem path na URL do proxy_pass: o Nginx repassa o caminho completo
    # (/api/eventos, /api/login etc.) intacto para o backend, que já
    # espera esse prefixo (routes/api.php é montado em /api pelo Laravel).
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React — container "alertas-web" publicado só em localhost.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
