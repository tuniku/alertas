# Orquestração de PRODUÇÃO. Roda no VPS, não na sua máquina local
# (para desenvolvimento local, use api/docker-compose.yml, que sobe um
# MySQL em container). Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Arquitetura: este VPS já usa um Nginx do sistema (fora do Docker) +
# Certbot como porta de entrada única em 80/443 para vários domínios, e
# um MySQL do sistema compartilhado pelos projetos hospedados aqui
# (acessível pelo phpMyAdmin em adbd.tuniku.com). O alertas segue esse
# mesmo padrão: os containers só publicam portas em 127.0.0.1 e o banco
# fica no MySQL do host, não em container.
#
#   alertas.tuniku.com/api/*  -> 127.0.0.1:8082 (container "api")
#   alertas.tuniku.com/*      -> 127.0.0.1:8081 (container "web")
#   banco                     -> MySQL do host (via host.docker.internal)
#   notificações              -> container "worker", consumindo a fila
#
# O site do Nginx fica em /etc/nginx/sites-available/alertas.tuniku.com
# (modelo versionado em deploy/alertas.tuniku.com.conf).

services:
  api:
    build:
      context: ./api
    container_name: alertas-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    # Faz "host.docker.internal" resolver para o IP do host dentro do
    # container — é assim que a API alcança o MySQL do sistema, que
    # escuta em 127.0.0.1 do ponto de vista do host (DB_HOST no
    # api/.env deve usar esse nome).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # .env fica fora da imagem (não vai pro git nem pro build) e é
      # montado em runtime — trocar uma senha não exige rebuild.
      - ./api/.env:/var/www/html/.env:ro
      - api-storage:/var/www/html/storage

  # Processa a fila de notificações (Discord e, futuramente, e-mail,
  # Telegram, Tuya). Roda a MESMA imagem da API, só que com outro
  # comando: sobrepõe o entrypoint para não rodar migrations nem subir
  # nginx/php-fpm — este container só consome jobs.
  #
  # --max-time=3600 recicla o worker de hora em hora: processos PHP de
  # vida longa acumulam memória e não enxergam código novo após um
  # deploy. O "restart: unless-stopped" traz ele de volta em seguida.
  worker:
    build:
      context: ./api
    container_name: alertas-worker
    restart: unless-stopped
    entrypoint: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api/.env:/var/www/html/.env:ro
      - api-storage:/var/www/html/storage
    depends_on:
      - api

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: https://alertas.tuniku.com/api
    container_name: alertas-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

volumes:
  api-storage:
