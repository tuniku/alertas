server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: qualquer rota do React Router (ex.: /projetos,
    # /alertas-ativos) que não seja um arquivo existente cai em
    # index.html, e o React Router assume o roteamento no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
